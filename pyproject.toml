[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emutrust"
version = "0.1.0.dev0"
description = "Neural network emulators for slow scientific models, with calibrated uncertainty you can trust in Bayesian inference."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Qurban", email = "mianqurban525@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "torch>=2.0"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16,<0.17"]

[project.urls]
Repository = "https://github.com/mqurban/emutrust"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
